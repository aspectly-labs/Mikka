name: Read cache API acceptance

on:
  workflow_call:
    secrets:
      HOSTED_UI_READ_KEY:
        # Read-only deploy key for the private UI (docs/ui-overlay.md): the client actions this acceptance reads are
        # published by the official interface, which only that checkout holds.
        required: true

permissions:
  contents: read

concurrency:
  group: read-cache-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-cache:
    name: Read cache API and CLI
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Only to read a queued pull request's branch name, to pick its paired private UI branch.
      pull-requests: read
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      # Read-cache acceptance discovers actions published by the Web client.
      MIKKA_EDITION: cloud
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_TEST_DB_PORT: '5432'
      # The routes check this exact origin (scripts/acceptance/run-read-cache.test.mjs); bind localhost.
      BETTER_AUTH_URL: http://localhost:3137
      E2E_BASE_URL: http://localhost:3137
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      NODE_OPTIONS: --max-old-space-size=6144
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      MIKKA_SIGNUP_IP_HOURLY: '1000'
      MIKKA_SIGNUP_GLOBAL_HOURLY: '10000'
      MIKKA_VERIFICATION_IP_HOURLY: '1000'
      MIKKA_VERIFICATION_GLOBAL_HOURLY: '10000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A paired change (public PR first, then the private UI PR of the same branch name) is accepted against that
      # branch while it exists; otherwise against the private UI's main, as a release build pairs them.
      - name: Pick the paired private UI branch
        id: hosted
        env:
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          PR_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch="$PR_REF"
          number=$(printf '%s' "$QUEUE_REF" | sed -n 's#^refs/heads/gh-readonly-queue/[^/]*/pr-\([0-9][0-9]*\)-.*#\1#p')
          if [ -z "$branch" ] && [ -n "$number" ]; then
            # A queued PR whose branch cannot be read fails here, rather than being accepted against the wrong UI.
            branch=$(curl -fsS --retry 3 --max-time 20 -H "authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$REPOSITORY/pulls/$number" | jq -r '.head.ref // empty')
            [ -n "$branch" ] || { echo "::error::Could not read the queued pull request's branch"; exit 1; }
          fi
          [ -n "$branch" ] || branch=main
          printf '%s' "$branch" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$' || { echo "::error::Unexpected branch name"; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Private UI branch: $branch (main if no such branch)"
      - name: Check out the paired private UI branch
        id: paired
        if: steps.hosted.outputs.branch != 'main'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ format('{0}/mikka-hosted-ui', vars.MIKKA_HOSTED_UI_GITHUB_OWNER || vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324') }}
          ref: ${{ steps.hosted.outputs.branch }}
          ssh-key: ${{ secrets.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Check out the private UI's main
        if: steps.paired.outcome != 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ format('{0}/mikka-hosted-ui', vars.MIKKA_HOSTED_UI_GITHUB_OWNER || vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324') }}
          ref: main
          ssh-key: ${{ secrets.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - name: Install private UI runtime dependencies without license scripts
        run: |
          echo "Accepted against private UI revision $(git -C .hosted-ui rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! pnpm --dir .hosted-ui install --ignore-workspace --prod --ignore-scripts --frozen-lockfile > "$RUNNER_TEMP/private-ui-install.log" 2>&1; then
            echo "::error::Private UI dependency installation failed; private diagnostics withheld."
            exit 1
          fi
      - name: Verify the bounded read-only driver
        run: node --import tsx --test scripts/acceptance/read-cache.test.mjs scripts/acceptance/run-read-cache.test.mjs
      - name: Generate ephemeral test-only authentication secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          NODE
      - run: pnpm test:e2e:setup
      - name: Bind the isolated database and application to this checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Build this isolated application for production-mode acceptance
        env:
          MIKKA_UI_OVERLAY_DIR: .hosted-ui
        run: pnpm build:app
      - name: Accept real incremental Server Actions and Settings GET
        run: node scripts/acceptance/run-read-cache.mjs
      - name: Check the public evidence for authentication material
        run: node scripts/test-accounts/cli.mjs audit-evidence --evidence .cache/e2e/http-acceptance-summary.json
      - name: Retain only the aggregate acceptance summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-cache-api-${{ github.sha }}
          path: .cache/e2e/http-acceptance-summary.json
          if-no-files-found: error
          retention-days: 7

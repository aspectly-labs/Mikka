name: Desktop release

# Publishes signed, notarized Apple Silicon installers for each main push that
# changes the app or something it bundles (the daemon client, protocol, lockfile).
# Versions use a fixed epoch above earlier calendar versions and the workflow
# run number: 2026.10000.<run_number>. Retries keep the version and built commit.
# Manual builds that skip notarization remain drafts.
#
# Existing signing and notarization credentials come from Infisical prod:/platform.
# ASC_* names are mapped to the release tools' APPLE_* inputs inside the runner.

on:
  # Only an automatic pipeline-production promotion that serves current main builds the
  # installer by itself (an owner gateway-observe or pipeline-promote dispatch never does);
  # a push only notes what is waiting
  # (docs/operations/web-deploy.md). While production promotion is manual (private
  # deploy-pipeline.json autoProduction: false), nothing promotes automatically, so the owner
  # dispatches this workflow by hand with the manual promotion's pipeline:RUN:ATTEMPT receipt
  # (docs/operations/build-source-of-truth.md#production-promotion-switch).
  workflow_run:
    workflows: [Cloudflare application deployment]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      # Shared renderer source and build inputs are part of the shipped app.
      - 'apps/frontend/**'
      - 'app/\[locale\]/**'
      - 'app/actions/**'
      - 'lib/**'
      - 'messages/**'
      - 'i18n/**'
      - 'public/**'
      - 'packages/config/**'
      - 'instrumentation-client.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'lib/daemon-commands.ts'
      - 'lib/local-device-setup.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'scripts/release/**'
      - 'config/release-security.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      overlay-sha:
        description: Private main revision expected from the dispatching push
        type: string
        default: ''
      cloudflare_receipt:
        description: 'Promoted Web evidence (actions:RUN:ATTEMPT, pipeline:RUN:ATTEMPT, or historical issue 1954 comment ID and body SHA-256)'
        type: string
        required: false
      skip_notarization:
        description: Build macOS without notarization (internal testing only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  MIKKA_PRIVATE_GITHUB_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER }}
  MIKKA_HOSTED_UI_GITHUB_OWNER: ${{ vars.MIKKA_HOSTED_UI_GITHUB_OWNER }}
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.3'

jobs:
  preflight:
    # A hand dispatch starts only for a promoter in config/release-promoters.json (actor id, actor and
    # re-run actor), before the policy token or any other secret is read.
    if: (github.repository_id == '1427517699' && ((github.repository == 'alexj11324/Mikka' && github.repository_owner_id == '183887963') || (github.repository == 'aspectly-labs/Mikka' && github.repository_owner_id == '359279274'))) && (github.event_name != 'workflow_dispatch' || (contains(fromJSON('["183887963","158243242"]'), github.actor_id) && contains(fromJSON('["alexj11324","devin-ai-integration[bot]"]'), github.actor) && contains(fromJSON('["alexj11324","devin-ai-integration[bot]"]'), github.triggering_actor)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Replace stale waits for the same release path. A receiptless push or another
    # deployment phase cannot cancel a preflight that verifies a promotion.
    concurrency:
      group: desktop-release-preflight-${{ github.ref }}-${{ github.event_name == 'workflow_run' && format('observed-{0}', github.event.workflow_run.id) || github.event_name == 'push' && 'push' || 'promoted' }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    env:
      EXPECTED_UI_OVERLAY_SHA: ${{ inputs.overlay-sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      overlay-sha: ${{ steps.promoted.outputs.overlay-sha }}
      # The served commit the installer is built from; main may have moved on since.
      product: ${{ steps.promoted.outputs.product }}
      release: ${{ steps.promoted.outcome == 'success' }}
      receipt: ${{ github.event.inputs.cloudflare_receipt || steps.trigger.outputs.receipt }}
      # Public projection of the release policy: promoters and the required Desktop checks.
      policy: ${{ steps.policy.outputs.policy }}
    steps:
      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Dispatch this workflow from main, not from a tag or branch. Actions caches are scoped per ref; a tag run cannot reuse the previous release's cache."
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The installer is built from the commit a production promotion serves, once
      # it is on main, so it never ships ahead of the Web it talks to.
      - name: Leave the installer to the Cloudflare promotion
        if: github.event_name == 'push'
        run: |
          echo "::notice title=Desktop waits for a promotion::This push builds nothing. The installer is built after an automatic production promotion serves this commit, or when a promoter dispatches this workflow."
          printf '### No installer from this push\n\nThe installer is built by itself only after an automatic pipeline-production promotion serves this commit (autoProduction true). While production promotion is manual, a promoter dispatches this workflow with the promotion receipt (docs/operations/build-source-of-truth.md#production-promotion-switch).\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Use a Cloudflare gateway observation whose served commit is on main
        id: trigger
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/cloudflare-promoted-web.mjs trigger desktop
      - name: Require the Cloudflare promotion receipt
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cloudflare_receipt == ''
        run: |
          echo "::error title=cloudflare_receipt required::Production Web is promoted by the Cloudflare deployment workflow. Dispatch again with that promotion's cloudflare_receipt."
          exit 1
      # The release policy (private mikka-cloud deploy-pipeline.json on main): promoters and required checks.
      # Only a read-only contents token is minted here; signing credentials come after every evidence gate.
      - name: Select the source App before policy access
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        id: source-app
        env:
          SOURCE_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324' }}
          ORG_SECRET_PATH: ${{ vars.MIKKA_ORG_GITHUB_SECRET_PATH }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const owner = process.env.SOURCE_OWNER
          if (!['alexj11324', 'aspectly-labs'].includes(owner)) throw Error('CI_SOURCE_APP_OWNER_REQUIRED')
          const path = owner === 'aspectly-labs' ? process.env.ORG_SECRET_PATH?.trim() : '/github'
          if (!path || /[\r\n]/.test(path)) throw Error('CI_SOURCE_APP_SECRET_PATH_REQUIRED')
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nsecret-path=${path}\napp-id=${owner === 'aspectly-labs' ? '5853576' : '4840908'}\n`)
          JS
      - name: Read the existing source App id
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Verify the selected source App
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        env:
          EXPECTED_SOURCE_APP_ID: ${{ steps.source-app.outputs.app-id }}
        run: node -e 'if (!process.env.EXPECTED_SOURCE_APP_ID || process.env.GITHUB_APP_ID !== process.env.EXPECTED_SOURCE_APP_ID) throw Error("CI_SOURCE_APP_ID_MISMATCH")'
      - name: Mint a short-lived read-only release policy token
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        id: policy-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          repositories: mikka-cloud
          permission-contents: read
      - name: Remove App credentials before reading the policy
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Read the reviewed release policy
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        id: policy
        env:
          MIKKA_OPERATIONS_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          MIKKA_OPERATIONS_READ_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: node scripts/release/release-policy.mjs read desktop
      # A dispatch is accepted only from a listed promoter (dispatcher and re-runner) on main's own workflow file.
      - name: Verify the promoted Cloudflare Web before allocating macOS
        id: promoted
        if: github.event_name == 'workflow_dispatch' || steps.trigger.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RECEIPT: ${{ github.event.inputs.cloudflare_receipt || steps.trigger.outputs.receipt }}
          MIKKA_RELEASE_POLICY: ${{ steps.policy.outputs.policy }}
        run: node scripts/release/cloudflare-promoted-web.mjs desktop
      - name: Version from workflow run
        id: version
        run: |
          # The epoch sorts after earlier YYYY.MMDD.HHMM versions; retries reuse the run number.
          version="2026.10000.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Mikka Desktop $version"

  macos:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: macos-26  # macos-15's Xcode 26.3 crashes compiling the glass layers of build/icon.icon
    timeout-minutes: 90
    # Finish the active signed candidate; GitHub keeps only the latest pending job.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'desktop-release' || format('desktop-release-{0}', github.ref) }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      checks: read
      issues: read
      id-token: write
    outputs:
      manifest-sha256: ${{ steps.seal.outputs.manifest-sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      MIKKA_UI_OVERLAY_SHA: ${{ needs.preflight.outputs.overlay-sha }}
      MIKKA_DESKTOP_SOURCE: ${{ needs.preflight.outputs.product }}
      MIKKA_RELEASE_POLICY: ${{ needs.preflight.outputs.policy }}
    steps:
      - name: Stage the trusted release verifier from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-verifier-checkout
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/release
            scripts/cloudflare-source.mjs
            lib/deployment-id.mjs
            lib/env/runtime.mjs
          persist-credentials: false
      - name: Copy the trusted release verifier outside the build workspace
        run: |
          mkdir -p "$RUNNER_TEMP/release-verifier/scripts" "$RUNNER_TEMP/release-verifier/lib/env"
          cp -R .release-verifier-checkout/scripts/release "$RUNNER_TEMP/release-verifier/scripts/release"
          cp .release-verifier-checkout/scripts/cloudflare-source.mjs "$RUNNER_TEMP/release-verifier/scripts/cloudflare-source.mjs"
          cp .release-verifier-checkout/lib/deployment-id.mjs "$RUNNER_TEMP/release-verifier/lib/deployment-id.mjs"
          cp .release-verifier-checkout/lib/env/runtime.mjs "$RUNNER_TEMP/release-verifier/lib/env/runtime.mjs"
          rm -rf .release-verifier-checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.product }}
          persist-credentials: false
      - name: Verify production credential delivery boundaries
        run: node --test scripts/mobile-ota-credentials.test.mjs scripts/release/apple-credentials.test.mjs
      - name: Recheck the promoted Web before loading private credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RECEIPT: ${{ needs.preflight.outputs.receipt }}
        run: node "$RUNNER_TEMP/release-verifier/scripts/release/cloudflare-promoted-web.mjs" desktop
      - name: Validate the selected private UI owner before credential access
        run: |
          node --input-type=module - <<'JS'
          import { privateMikkaRepository } from './scripts/cloudflare-source.mjs'
          privateMikkaRepository('mikka-hosted-ui')
          JS
      - name: Read the private UI checkout credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: HOSTED_UI_READ_KEY
          include-imports: false
      - name: Check out the production Web UI revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ format('{0}/mikka-hosted-ui', vars.MIKKA_HOSTED_UI_GITHUB_OWNER || vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324') }}
          ref: ${{ needs.preflight.outputs.overlay-sha }}
          ssh-key: ${{ env.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Pin the private UI revision
        run: node scripts/release/hosted-ui.mjs record .hosted-ui
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The installed renderer uses the shared Vite and application dependency
      # graph, including apps/frontend and root UI/CSS build dependencies.
      - run: pnpm install --frozen-lockfile
      - name: Check the private UI's paid-source list and patch ledger
        # The overlay's own check runs before it is built in: scripts/paid-sources.mjs, or on a pinned overlay older than
        # that, its predecessor scripts/paid-overrides.mjs. An overlay with neither has nothing to run (as before).
        # Paid blocks themselves are edited to match the top-product reference
        # (docs/design/decisions/2026-11-27-1409-top-products-over-paid-blocks.md).
        run: |
          if [ -f .hosted-ui/scripts/paid-sources.mjs ]; then
            node .hosted-ui/scripts/paid-sources.mjs
          elif [ -f .hosted-ui/scripts/paid-overrides.mjs ]; then
            node .hosted-ui/scripts/paid-overrides.mjs
          fi
      - name: Install private UI runtime dependencies without license scripts
        run: |
          if ! pnpm --dir .hosted-ui install --ignore-workspace --prod --ignore-scripts --frozen-lockfile > "$RUNNER_TEMP/private-ui-install.log" 2>&1; then
            echo "::error::Private UI dependency installation failed; private diagnostics withheld."
            exit 1
          fi
      # Evidence for this exact public + hosted pairing, before any signing credential: the desktop
      # UI API route contract (mandatory, never skipped) plus every Desktop check the policy lists.
      - name: Run the required release checks for this exact public and hosted pairing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIKKA_RELEASE_SOURCE: ${{ needs.preflight.outputs.product }}
        run: node "$RUNNER_TEMP/release-verifier/scripts/release/release-checks.mjs" run desktop
      - name: Cache electron-builder downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - name: Prepare the pinned native Electron and builder checksum cache
        run: node apps/desktop/scripts/install-electron.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read existing APPLE_DEVELOPER_ID_P12_BASE64 through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: APPLE_DEVELOPER_ID_P12_BASE64
          recursive: false
          include-imports: false
      - name: Read existing APPLE_DEVELOPER_ID_P12_PASSWORD through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: APPLE_DEVELOPER_ID_P12_PASSWORD
          recursive: false
          include-imports: false
      - name: Read existing APPLE_TEAM_ID through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: APPLE_TEAM_ID
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_P8 through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_P8
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_ID through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_ID
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_ISSUER_ID through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_ISSUER_ID
          recursive: false
          include-imports: false
      - name: Map existing Apple credential names in the trusted runner
        run: node scripts/release/apple-credentials.mjs --desktop
      - name: Require the Developer ID certificate
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" || {
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 / APPLE_DEVELOPER_ID_P12_PASSWORD are missing"
            exit 1
          }
      - name: Materialize App Store Connect key
        if: ${{ env.APPLE_API_KEY_P8_BASE64 != '' }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Require notarization credentials
        if: ${{ !inputs.skip_notarization }}
        run: |
          if { test -z "$APPLE_ID" || test -z "$APPLE_APP_SPECIFIC_PASSWORD" || test -z "$APPLE_TEAM_ID"; } &&
             { test -z "$APPLE_API_KEY" || test -z "$APPLE_API_KEY_ID" || test -z "$APPLE_API_ISSUER"; }; then
            echo "::error::Infisical Apple notarization credentials are missing. Use skip_notarization only for internal builds."
            exit 1
          fi
      - name: Select Xcode 26 for actool
        run: |
          # electron-builder compiles mac.icon (an Icon Composer .icon) with actool 26+.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          test -n "$xcode" || { echo "::error::No Xcode 26 on this runner; build/icon.icon needs actool 26+"; exit 1; }
          sudo xcode-select -s "$xcode"
          actool --version
      # Desktop telemetry uses the web's PostHog project; its ingestion key is
      # public (apps/desktop/src/main/telemetry.ts). A build without it sends nothing.
      # No host is read: the project is in PostHog's US region, the build's
      # default (https://us.i.posthog.com, as the web's DEFAULT_POSTHOG_API_HOST).
      - name: Read the existing PostHog project ingestion key through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: NEXT_PUBLIC_POSTHOG_KEY
          include-imports: false
      - name: Stamp the release version
        working-directory: apps/desktop
        run: npm pkg set version="$RELEASE_VERSION"
      - name: Package signed macOS app
        run: |
          if ! pnpm --filter @mikka/desktop package:mac > "$RUNNER_TEMP/official-desktop-build.log" 2>&1; then
            echo "::error::Official desktop build failed; private compiler diagnostics withheld."
            exit 1
          fi
      - name: Audit the packaged app-owned files
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          const desktop = createRequire(new URL('./apps/desktop/package.json', `file://${process.cwd()}/`))
          const builder = createRequire(desktop.resolve('electron-builder'))
          const app = createRequire(builder.resolve('app-builder-lib'))
          app('@electron/asar').extractAll('apps/desktop/release/mac-arm64/Mikka.app/Contents/Resources/app.asar', `${process.env.RUNNER_TEMP}/official-packaged-app`)
          NODE
          node scripts/release/hosted-ui.mjs audit "$RUNNER_TEMP/official-packaged-app"
          node scripts/release/hosted-ui.mjs audit apps/desktop/release/mac-arm64/Mikka.app/Contents/Resources
      - name: Verify production fuses in the signed bundle
        run: |
          node --input-type=module <<'NODE'
          import { resolve } from 'node:path'
          import { inspectReleaseFuses } from './apps/desktop/scripts/verify-mac-package.mjs'
          const fuses = await inspectReleaseFuses(resolve('apps/desktop/release/mac-arm64/Mikka.app'))
          console.log(JSON.stringify({ version: 1, kind: 'production-desktop-fuses', passed: true, fuses }))
          NODE
      - name: Verify updater metadata
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test -f apps/desktop/release/latest-mac.yml
          test -f "apps/desktop/release/mac-arm64/Mikka.app/Contents/Resources/app-update.yml"
          test -f "apps/desktop/release/Mikka-${version}-mac-arm64.zip"
          grep -q "Mikka-${version}-mac-arm64.zip" apps/desktop/release/latest-mac.yml
          echo "Updater metadata matches Mikka ${version} (arm64)"
      - name: Stage and inventory the exact signed installers
        run: |
          node scripts/release/evidence.mjs stage-desktop apps/desktop/release "$RUNNER_TEMP/mikka-desktop-release-candidate"
          pnpm --filter @mikka/desktop list --depth Infinity --json > "$RUNNER_TEMP/desktop-dependency-tree.json"
          node scripts/release/workspace-sbom.mjs "$RUNNER_TEMP/desktop-dependency-tree.json" "$RUNNER_TEMP/mikka-desktop-release-candidate/sbom.cdx.json"
      - name: Record the installer overlay revision
        run: node scripts/release/hosted-ui.mjs desktop-evidence "$RUNNER_TEMP/mikka-desktop-release-candidate"
      - name: Seal the signed candidate
        id: seal
        run: node scripts/release/evidence.mjs seal "$RUNNER_TEMP/mikka-desktop-release-candidate"
      - name: Require successful checks for this exact main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/ci-gate.mjs
      - name: Verify the signed candidate before creating the release
        env:
          RELEASE_MANIFEST_SHA256: ${{ steps.seal.outputs.manifest-sha256 }}
        run: node scripts/release/evidence.mjs verify "$RUNNER_TEMP/mikka-desktop-release-candidate"
      - name: Recheck the promoted Web before publishing the signed installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RECEIPT: ${{ needs.preflight.outputs.receipt }}
        run: node "$RUNNER_TEMP/release-verifier/scripts/release/cloudflare-promoted-web.mjs" desktop
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-${{ env.RELEASE_VERSION }}
          target_commitish: ${{ needs.preflight.outputs.product }}
          name: Mikka Desktop ${{ env.RELEASE_VERSION }}
          draft: ${{ inputs.skip_notarization == true }}
          # electron-updater follows releases/latest; 'legacy' compares tags as text, so .9 outranked .31.
          make_latest: ${{ inputs.skip_notarization && 'false' || 'true' }}
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/mikka-desktop-release-candidate/*

      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

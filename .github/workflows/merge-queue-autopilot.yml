name: Merge queue autopilot

on:
  workflow_run:
    workflows: [CI, Browser gate]
    types: [completed]

permissions: {}

concurrency:
  group: merge-queue-autopilot-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  enqueue:
    if: >-
      github.repository_id == '1427517699' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      # This privileged workflow uses only GitHub metadata. It never loads PR code or artifacts.
      - name: Find the eligible PR for this completed run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          prs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls?per_page=100")
          pr=$(jq -c --arg head "$HEAD_SHA" --arg branch "$HEAD_BRANCH" --arg repo "$GITHUB_REPOSITORY" '
            [flatten[] | select(.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo)] as $open
            | $open[] as $pr
            | select($pr.head.sha == $head and $pr.head.ref == $branch and ($pr.draft | not))
            | select(all($open[]; .number == $pr.number or (.head.ref | startswith("batch/") | not)))
            | {id: $pr.node_id, number: $pr.number}
          ' <<< "$prs")
          if [ -z "$pr" ]; then
            echo "No standalone ready main PR at $HEAD_SHA"
            exit 0
          fi
          pr_number=$(jq -er '.number' <<< "$pr")
          pr_id=$(jq -er '.id' <<< "$pr")
          # shellcheck disable=SC2016
          state=$(gh api graphql -f id="$pr_id" -f query='
            query($id:ID!) {
              node(id:$id) {
                ... on PullRequest {
                  mergeStateStatus
                  mergeQueueEntry { id }
                  stackEntry { id }
                  timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                    nodes {
                      ... on RemovedFromMergeQueueEvent {
                        actor { login }
                      }
                    }
                  }
                }
              }
            }' --jq '.data.node')
          if ! jq -e '.mergeStateStatus == "CLEAN" and .mergeQueueEntry == null and .stackEntry == null' <<< "$state" >/dev/null; then
            echo "PR #$pr_number is not eligible, is already queued, or belongs to a stack"
            exit 0
          fi
          # A removal whose actor is not github-merge-queue — including one with
          # no recorded actor — was a deliberate pull or is unattributable;
          # never put such a PR back.
          removals=$(jq -r '.timelineItems.nodes | length' <<< "$state")
          remover=$(jq -r '.timelineItems.nodes[0].actor.login // ""' <<< "$state")
          if [ "$removals" -gt 0 ] && [ "$remover" != "github-merge-queue" ]; then
            echo "PR #$pr_number was pulled from the merge queue by $remover; not re-enqueueing"
            exit 0
          fi
          checks=$(gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --required --json bucket) || {
            status=$?
            if [ "$status" -ne 8 ]; then
              exit "$status"
            fi
            echo "Required checks are still running for #$pr_number"
            exit 0
          }
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass")' <<< "$checks" >/dev/null; then
            echo "Required checks are not all green for #$pr_number"
            exit 0
          fi
          printf 'id=%s\nnumber=%s\n' "$pr_id" "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Read the existing product App ID
        if: steps.candidate.outputs.id != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false

      - name: Read the existing product App key
        if: steps.candidate.outputs.id != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false

      - name: Verify the product App identity
        if: steps.candidate.outputs.id != ''
        run: test "${GITHUB_APP_ID:-}" = 4840908

      - name: Mint a repository-scoped App token
        if: steps.candidate.outputs.id != ''
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Enqueue the checked head
        if: steps.candidate.outputs.id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_ID: ''
          GITHUB_APP_PRIVATE_KEY: ''
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_ID: ${{ steps.candidate.outputs.id }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          position=$(gh api graphql -f id="$PR_ID" -f head="$HEAD_SHA" -f query='
            mutation($id:ID!, $head:GitObjectID!) {
              enqueuePullRequest(input:{pullRequestId:$id, expectedHeadOid:$head}) {
                mergeQueueEntry { position }
              }
            }' --jq '.data.enqueuePullRequest.mergeQueueEntry.position')
          test -n "$position"
          echo "Enqueued PR #$PR_NUMBER at position $position"

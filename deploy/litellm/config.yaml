# Model aliases and upstream credentials live in LiteLLM, outside Mikka.
model_list:
  - model_name: mikka-default
    litellm_params:
      model: vercel_ai_gateway/deepseek/deepseek-v4.1-flash
      api_key: os.environ/AI_GATEWAY_API_KEY
    model_info:
      input_cost_per_token: 0.00000030
      output_cost_per_token: 0.00000120
      cache_read_input_token_cost: 0.000000006
  - model_name: mikka-title
    litellm_params:
      model: vercel_ai_gateway/openai/gpt-6-luna
      reasoning_effort: none
      api_key: os.environ/AI_GATEWAY_API_KEY
    model_info:
      input_cost_per_token: 0.00000010
      output_cost_per_token: 0.00000050
      cache_read_input_token_cost: 0.000000010
  - model_name: mikka-planning
    litellm_params:
      model: vercel_ai_gateway/openai/gpt-6-luna
      api_key: os.environ/AI_GATEWAY_API_KEY
    model_info:
      input_cost_per_token: 0.00000010
      output_cost_per_token: 0.00000050
      cache_read_input_token_cost: 0.000000010
  - model_name: mikka-decision
    litellm_params:
      model: openai/openai/gpt-6-luna-decisions
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/AI_GATEWAY_API_KEY
    model_info:
      mode: decisions
      base_model: gpt-6-luna
      input_cost_per_token: 0.00000010
      output_cost_per_token: 0
      cache_read_input_token_cost: 0.000000010
      cache_creation_input_token_cost: 0.000000125
      input_cost_per_token_above_272k_tokens: 0.00000020
      cache_read_input_token_cost_above_272k_tokens: 0.000000020
      cache_creation_input_token_cost_above_272k_tokens: 0.000000250
  - model_name: mikka-credits/*
    litellm_params:
      model: vercel_ai_gateway/*
      api_key: os.environ/AI_GATEWAY_API_KEY
  # These approved Gateway allocations speak native protocols. The credits
  # wildcard remains the Chat Completions route for ordinary managed calls.
  - model_name: mikka-native-responses/openai/gpt-6-luna
    litellm_params:
      model: openai/openai/gpt-6-luna
      api_base: os.environ/VERCEL_AI_GATEWAY_API_BASE
      api_key: os.environ/AI_GATEWAY_API_KEY
    model_info:
      mode: responses
  - model_name: neon/gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_base: os.environ/NEON_AI_GATEWAY_CHAT_URL
      api_key: os.environ/NEON_AI_GATEWAY_TOKEN
  # Request credentials are set by Mikka for these BYOK routes only.
  - model_name: openai/chat_completions/*
    litellm_params:
      model: openai/chat_completions/*
      configurable_clientside_auth_params: ["api_base"]
  - model_name: openai/*
    litellm_params:
      model: openai/*
      configurable_clientside_auth_params: ["api_base"]
  - model_name: anthropic/*
    litellm_params:
      model: anthropic/*
      configurable_clientside_auth_params: ["api_base"]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  pass_through_endpoints:
    - path: /v1/mikka/subscription/chat
      target: os.environ/MIKKA_SUBSCRIPTION_CPA_CHAT_URL
      methods: ["POST"]
      forward_headers: false
      headers:
        Content-Type: application/json
      auth: true
      timeout: 290
    - path: /v1/mikka/catalog
      target: https://ai-gateway.vercel.sh/v1/models
      methods: ["GET"]
      forward_headers: false
      auth: true
    - path: /v1/mikka/managed-search/haiku/stream/language-model
      target: os.environ/VERCEL_AI_GATEWAY_LANGUAGE_MODEL_URL
      methods: ["POST"]
      forward_headers: false
      headers:
        Authorization: Bearer os.environ/AI_GATEWAY_API_KEY
        Content-Type: application/json
        ai-gateway-protocol-version: "0.0.1"
        ai-gateway-auth-method: api-key
        ai-language-model-specification-version: "4"
        ai-language-model-id: anthropic/claude-haiku-5.5
        ai-language-model-streaming: "true"
      auth: true
    - path: /v1/mikka/managed-search/haiku/generate/language-model
      target: os.environ/VERCEL_AI_GATEWAY_LANGUAGE_MODEL_URL
      methods: ["POST"]
      forward_headers: false
      headers:
        Authorization: Bearer os.environ/AI_GATEWAY_API_KEY
        Content-Type: application/json
        ai-gateway-protocol-version: "0.0.1"
        ai-gateway-auth-method: api-key
        ai-language-model-specification-version: "4"
        ai-language-model-id: anthropic/claude-haiku-5.5
        ai-language-model-streaming: "false"
      auth: true
    - path: /v1/mikka/gateway-generation
      target: os.environ/VERCEL_AI_GATEWAY_GENERATION_URL
      methods: ["GET"]
      forward_headers: false
      merge_query_params: true
      headers:
        Authorization: Bearer os.environ/AI_GATEWAY_API_KEY
      auth: true
    - path: /v1/mikka/subscription/claude/messages
      target: https://api.anthropic.com/v1/messages?beta=true
      methods: ["POST"]
      forward_headers: true
      headers:
        x-litellm-api-key: ""
      auth: true
    - path: /v1/mikka/subscription/claude/count_tokens
      target: https://api.anthropic.com/v1/messages/count_tokens?beta=true
      methods: ["POST"]
      forward_headers: true
      headers:
        x-litellm-api-key: ""
      auth: true
    - path: /v1/mikka/subscription/codex/responses
      target: https://chatgpt.com/backend-api/codex/responses
      methods: ["POST"]
      forward_headers: true
      headers:
        x-litellm-api-key: ""
      auth: true
litellm_settings:
  include_cost_in_streaming_usage: true
  drop_params: true
  turn_off_message_logging: true
